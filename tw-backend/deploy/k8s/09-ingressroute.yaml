apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mud-world-ingress-http
  namespace: mud-world
spec:
  entryPoints:
    - web
  routes:
  - match: PathPrefix(`/api`)
    kind: Rule
    services:
    - name: game-server
      port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mud-world-ingress-https
  namespace: mud-world
spec:
  entryPoints:
    - websecure
  routes:
  - match: PathPrefix(`/api`)
    kind: Rule
    services:
    - name: game-server
      port: 8080
  tls: {}
