apiVersion: v1
kind: ConfigMap
metadata:
  name: core-physics-config
  namespace: tw-world
data:
  # Connection Strings (Service Names)
  NATS_URL: "nats://tw-nats.tw-world.svc.cluster.local:4222"
  MINIO_ENDPOINT: "tw-minio.tw-world.svc.cluster.local:9000"
  ANALYTICS_URL: "postgres://admin:password123@tw-timescaledb.tw-world.svc.cluster.local:5432/tw_metrics?sslmode=disable"
  DB_HOST: "tw-postgis.tw-world.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "tw_core"
  PORT: "8080"
  
  # Simulation Config

  
---
apiVersion: v1
kind: Secret
metadata:
  name: core-physics-secrets
  namespace: tw-world
type: Opaque
stringData:
  # Placeholders - in production these should be sealed secrets or injected
  DATABASE_URL: "postgres://admin:password123@tw-postgis.tw-world.svc.cluster.local:5432/tw_core?sslmode=disable"
  MINIO_ACCESS_KEY: "admin"
  MINIO_SECRET_KEY: "password123"
  JWT_SECRET: "change-me-in-production-secret-key-123"
