apiVersion: v1
kind: ConfigMap
metadata:
  name: core-physics-config
  namespace: mud-world
data:
  # Connection Strings (Service Names)
  NATS_URL: "nats://mud-nats.mud-world.svc.cluster.local:4222"
  MINIO_ENDPOINT: "mud-minio.mud-world.svc.cluster.local:9000"
  DB_HOST: "mud-postgis.mud-world.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "mud_core"
  PORT: "8080"
  
  # Simulation Config
  AGONES_SDK_HTTP_PORT: "9358" # Standard Agones Sidecar Port
  
---
apiVersion: v1
kind: Secret
metadata:
  name: core-physics-secrets
  namespace: mud-world
type: Opaque
stringData:
  # Placeholders - in production these should be sealed secrets or injected
  DATABASE_URL: "postgres://admin:password123@mud-postgis.mud-world.svc.cluster.local:5432/mud_core?sslmode=disable"
  MINIO_ACCESS_KEY: "admin"
  MINIO_SECRET_KEY: "password123"
  JWT_SECRET: "change-me-in-production-secret-key-123"
