apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tw-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: tw-frontend/frontend:latest
        imagePullPolicy: Never
        env:
        # Initial ORIGIN for server-side checks. Client connects to Node IP.
        - name: ORIGIN
          value: "https://10.0.0.17"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "3000"
        - name: BACKEND_URL
          value: "http://game-server:8080"
        ports:
        - containerPort: 3000
        resources:
          limits:
            memory: 1Gi
            cpu: "1.0"
          requests:
            memory: 256Mi
            cpu: "0.2"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tw-world
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: frontend

