# DATABASE (PostGIS)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tw-postgis
  namespace: tw-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tw-postgis
  template:
    metadata:
      labels:
        app: tw-postgis
    spec:
      containers:
      - name: postgis
        image: postgis/postgis:16-3.4
        env:
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          value: "password123"
        - name: POSTGRES_DB
          value: "tw_core"
        ports:
        - containerPort: 5432
        resources:
          limits:
            memory: 2Gi
          requests:
            memory: 512Mi
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: tw-world
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tw-postgis
  namespace: tw-world
spec:
  ports:
  - port: 5432
  selector:
    app: tw-postgis
---
# NATS JETSTREAM
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tw-nats
  namespace: tw-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tw-nats
  template:
    metadata:
      labels:
        app: tw-nats
    spec:
      containers:
      - name: nats
        image: nats:2.10-alpine
        args: ["-js", "-sd", "/data", "-m", "8222"]
        ports:
        - containerPort: 4222
        - containerPort: 9222 # Monitoring
        resources:
          limits:
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tw-nats
  namespace: tw-world
spec:
  ports:
  - port: 4222
    name: client
  - port: 8222
    name: cluster
  - port: 9222
    name: monitor
  selector:
    app: tw-nats
---
# DRAGONFLYDB (Redis)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tw-dragonfly
  namespace: tw-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tw-dragonfly
  template:
    metadata:
      labels:
        app: tw-dragonfly
    spec:
      containers:
      - name: dragonfly
        image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
        args: ["--default_lua_flags=allow-undeclared-keys", "--proactor_threads=4"]
        ports:
        - containerPort: 6379
        resources:
          limits:
            memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tw-dragonfly
  namespace: tw-world
spec:
  ports:
  - port: 6379
  selector:
    app: tw-dragonfly
---
# MINIO (S3)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tw-minio
  namespace: tw-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tw-minio
  template:
    metadata:
      labels:
        app: tw-minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args: ["server", "/data", "--console-address", ":9001"]
        env:
        - name: MINIO_ROOT_USER
          value: "admin"
        - name: MINIO_ROOT_PASSWORD
          value: "password123"
        ports:
        - containerPort: 9000
        - containerPort: 9001
        resources:
          limits:
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tw-minio
  namespace: tw-world
spec:
  ports:
  - port: 9000
    name: api
  - port: 9001
    name: console
  selector:
    app: tw-minio
---
# OLLAMA (LLM)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tw-ollama
  namespace: tw-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tw-ollama
  template:
    metadata:
      labels:
        app: tw-ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0"
        - name: OLLAMA_ORIGINS
          value: "*"
        - name: OLLAMA_KEEP_ALIVE
          value: "10m"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        ports:
        - containerPort: 11434
        resources:
          limits:
            memory: 8Gi
            cpu: "3.5"
          requests:
            memory: 4Gi
            cpu: "1.0"
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
      volumes:
      - name: ollama-models
        persistentVolumeClaim:
          claimName: ollama-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tw-ollama
  namespace: tw-world
spec:
  ports:
  - port: 11434
    name: http
  selector:
    app: tw-ollama
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: tw-world
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

