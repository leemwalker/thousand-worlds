# TimescaleDB for Analytics (Phase 5)
# Time-series database for simulation metrics
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mud-timescaledb
  namespace: mud-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mud-timescaledb
  template:
    metadata:
      labels:
        app: mud-timescaledb
    spec:
      containers:
      - name: timescaledb
        image: timescale/timescaledb:latest-pg16
        env:
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_PASSWORD
          value: "password123"
        - name: POSTGRES_DB
          value: "mud_metrics"
        args: ["postgres", "-c", "shared_buffers=512MB"]
        ports:
        - containerPort: 5432
        resources:
          limits:
            memory: 2Gi
            cpu: "2"
          requests:
            memory: 512Mi
            cpu: "0.5"
        volumeMounts:
        - name: timescale-storage
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "admin", "-d", "mud_metrics"]
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "admin", "-d", "mud_metrics"]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: timescale-storage
        persistentVolumeClaim:
          claimName: timescaledb-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timescaledb-pvc
  namespace: mud-world
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mud-timescaledb
  namespace: mud-world
spec:
  ports:
  - port: 5432
    name: postgres
  selector:
    app: mud-timescaledb
