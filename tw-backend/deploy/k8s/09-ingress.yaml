apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mud-world-ingress
  namespace: mud-world
  annotations:
    # Enable HTTP entrypoint (port 80)
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      # API and WebSocket routes to game-server
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: game-server
            port:
              number: 8080
      # Frontend routes (catch-all)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
