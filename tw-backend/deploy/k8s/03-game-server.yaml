apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-server
  namespace: tw-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-server
  template:
    metadata:
      labels:
        app: game-server
    spec:
      containers:
      - name: game-server
        image: tw-backend/game-server:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: core-physics-secrets
              key: DATABASE_URL
        - name: REDIS_ADDR
          value: "tw-dragonfly.tw-world.svc.cluster.local:6379"
        - name: NATS_URL
          value: "nats://tw-nats:4222"
        - name: CORS_ALLOWED_ORIGINS
          value: "http://localhost:5173,http://localhost:3000,http://10.0.0.17,http://10.0.0.17:8080,https://10.0.0.17,http://10.0.0.17:30000"
        - name: OLLAMA_HOST
          value: "http://tw-ollama.tw-world.svc.cluster.local:11434"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: core-physics-secrets
              key: JWT_SECRET
        - name: PORT
          value: "8080"
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: 4Gi
            cpu: "2.0"
          requests:
            memory: 1Gi
            cpu: "0.5"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: game-server
  namespace: tw-world
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: game-server

