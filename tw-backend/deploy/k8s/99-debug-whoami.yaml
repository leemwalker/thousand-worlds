apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: mud-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - name: whoami
        image: traefik/whoami
        args:
        - --port=8080
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: mud-world
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: http
    traefik.ingress.kubernetes.io/service.passhostheader: "false"
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: whoami
