apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: mud-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - name: whoami
        image: traefik/whoami
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: mud-world
spec:
  ports:
  - port: 3000
    targetPort: 80
    name: http
  selector:
    app: whoami
