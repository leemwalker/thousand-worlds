apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tw-world-ingress
  namespace: tw-world
  annotations:
    # Nginx-specific annotations if needed, usually default is fine.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    # K8s Ingress formally requires DNS names, but many controllers handle IPs or loose matching.
    # If explicit host matching fails, we can omit 'rules[].host' to match all.
    - "10.0.0.17"
    secretName: nginx-certs
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: game-server
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
