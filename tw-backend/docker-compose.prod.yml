# Production docker-compose with application services
# Server: Babylon (10.0.0.17) - Intel i7-6700K (8 threads), 32GB RAM

services:
  # Infrastructure services
  postgis:
    image: postgis/postgis:16-3.4
    container_name: mud_postgis
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: mud_core
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mud_net
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'
        reservations:
          memory: 2G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d mud_core" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres -c shared_buffers=4GB

  mongo:
    image: mongo:7.0
    container_name: mud_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db
    networks:
      - mud_net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nats:
    image: nats:2.10-alpine
    container_name: mud_nats
    ports:
      - "4222:4222"
      - "8222:8222"
      - "9222:9222"
    command: "-js -sd /data -m 8222"
    volumes:
      - nats_data:/data
    networks:
      - mud_net
    deploy:
      resources:
        limits:
          memory: 1G # Increased for JetStream
          cpus: '1.0'
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 3

  dragonfly:
    image: dragonflydb/dragonfly:latest
    container_name: mud_dragonfly
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data
    networks:
      - mud_net
    ulimits:
      memlock: -1
    command: --default_lua_flags=allow-undeclared-keys
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: mud_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - mud_net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: mud_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_KEEP_ALIVE=10m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    networks:
      - mud_net
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '3.5'
        reservations:
          memory: 4G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/api/version" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s

  # Application services
  game-server:
    build:
      context: .
      dockerfile: Dockerfile.game-server
    container_name: mud_game_server
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB:-mud_core}?sslmode=disable
      - REDIS_ADDR=dragonfly:6379
      - NATS_URL=nats://nats:4222
      - OLLAMA_HOST=http://ollama:11434
      - JWT_SECRET=${JWT_SECRET}
      - PORT=8080
    depends_on:
      postgis:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - mud_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 512M
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  core-physics:
    build:
      context: .
      dockerfile: Dockerfile.core-physics
    container_name: mud_core_physics
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB:-mud_core}?sslmode=disable
      - NATS_URL=nats://nats:4222
      - WORLD_ID=d8666327-0474-4b47-a461-9f9351052210
    depends_on:
      nats:
        condition: service_healthy
      postgis:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    networks:
      - mud_net
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
    restart: unless-stopped

  frontend:
    build:
      context: ../tw-frontend
      dockerfile: Dockerfile
    container_name: mud_frontend
    ports:
      - "3000:3000"
    environment:
      - ORIGIN=http://localhost:3000
    depends_on:
      - game-server
    networks:
      - mud_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  mud_net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  nats_data:
  dragonfly_data:
  minio_data:
  ollama_models:
